[project]
name = "refundhunter"
version = "0.1.0"
description = "Refund Hunter: a Strands agent that reads your receipts, finds the refunds you are owed, and files the claim once you say yes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=1.0",
    "strands-agents-tools>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "boto3>=1.35",
    "typer>=0.12",
    "pyyaml>=6.0",
    "bedrock-agentcore>=1.9",
    "aws-opentelemetry-distro>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
refundhunter = "refundhunter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refundhunter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
